name: CI

on:
  push:
    pull_request:
      branches: [main]

permission:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockflow_ci
          MYSQL_USER: stockflow_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd"mysqladmin ping -h 127.0.0.1 --silent"
          --health-intervals=10s
          --health-timeout=5s
          --heal-retries=10

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./gradlew build --no--daemon
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/stockflow_ci?useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: stockflow_ci
          DB_PASSWORD: ci-only-password
          JWT_SECRET: c3RvY2tmbG93LWNpLW9ubHktdGVzdC1rZXktMzItYnl0ZXM=
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_FLYWAY_ENABLED: 'false'