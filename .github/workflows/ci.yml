name: CI - Test, Build and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Test, Build and Publish Docker Image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockflow_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle execution permission
        run: chmod +x gradlew

      - name: Run tests and build
        run: ./gradlew clean build
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/stockflow_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpassword

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/blair-jeon/stock-flow:${{ github.sha }}