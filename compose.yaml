services:
 mysql:
  image: mysql:8.4
  ports:
   - "127.0.0.1:3306:3306"
  environment:
   MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
   MYSQL_DATABASE: stockflow
  volumes:
   - mysql-data:/var/lib/mysql
 redis:
  image: redis:latest
  ports:
   - "127.0.0.1:6379:6379"
  volumes:
   - redis-data:/data

volumes:
 mysql-data:
 redis-data:
